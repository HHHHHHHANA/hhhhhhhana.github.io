      --accent: #e11d48;

    body {

      font-size: 13px;
      color: #e0e7ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .helper-bar span strong { color: #fda4af; }
    .helper-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .helper-btn:hover { background: rgba(255,255,255,0.2); }

    header {

      margin: 0 auto;
      padding: 64px 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 32px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #fda4af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 8px;
      max-width: 600px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-top: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
    }
    .btn:hover {
      border-color: #52525b;
      transform: translateY(-2px);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #be123c;
      border-color: #be123c;
    }

    .nav-container {
      max-width: 1240px;
      margin: 32px auto 28px;
      padding: 0 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab:hover {
      color: var(--text-main);
      border-color: #3f3f46;
    }
    .filter-tab.active {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
      font-weight: 600;
    }

    /* 作品网格 */
    .gallery {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 28px;
    }
    @media (max-width: 640px) {
      .gallery { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: #52525b;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
    }

    /* 视觉封面区域 */
    .card-cover {
      width: 100%;
      height: 250px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .card-cover img {
      transform: scale(1.04);
    }

    /* 定制主题视觉占位背景（未放本地图时直接展示美观效果） */
    .art-placeholder {
      width: 100%;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .art-placeholder::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12), transparent 60%);
      pointer-events: none;
    }
    .art-watermark {
      font-size: 42px;
      font-weight: 900;
      opacity: 0.18;
      letter-spacing: 2px;
      align-self: flex-end;
      font-family: Georgia, serif;
    }
    .art-preview-label {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 6px;
      width: fit-content;
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* 快速换图按钮 */
    .replace-img-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 5;
    }
    .card:hover .replace-img-btn { opacity: 1; }
    .replace-img-btn:hover { background: var(--accent); border-color: var(--accent); }

    /* 卡片信息区 */
    .card-body {

      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;

    .category-badge {
      font-size: 12px;
      font-weight: 600;
      color: #fda4af;
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 6px;

      color: var(--text-muted);

    .card-title {

      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;

    .card-desc {

      color: var(--text-muted);

      flex-wrap: wrap;
      margin-top: auto;

      background: var(--tag-bg);
      color: #d1d5db;
      padding: 4px 10px;

      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;

    .modal-content {
      background: #18181d;
      border: 1px solid #2e2e38;
      border-radius: 16px;
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #27272a;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .modal-preview-box {
      width: 100%;
      min-height: 320px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid #2e2e38;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
    }

      max-width: 100%;
      max-height: 520px;
      object-fit: contain;
    }

    .modal-details p { color: #d1d5db; font-size: 15px; margin-bottom: 16px; }
    .modal-checklist {
      background: #121216;
      border: 1px solid #27272a;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 14px;
      color: #9ca3af;
    }
    .modal-checklist li { margin-left: 18px; margin-bottom: 6px; }
  </style>
</head>

          "高燃与叙事组图：赤金碎光爆发、云端飞鸽剪影、红蓝双生宿命对峙及日落金山群狼"
        ],
        tags: ["商业插图", "光影氛围", "场景叙事", "委托稿件"],
        localPath: "images/comm_illust.jpg",
        gradient: "linear-gradient(135deg, #1e40af 0%, #7e22ce 50%, #991b1b 100%)",

      },
      {

        category: "commission",
        categoryName: "商业与委托 · 出版书封",

        desc: "为体育竞技题材作品绘制的横版通页书封，捕捉羽毛球双打腾空扣杀的高燃瞬间。",
        bullets: [

          "精准刻画双人运动肌肉动态与球网空间透视，预留左上方书名排版呼吸感"
        ],
        tags: ["小说书封", "出版物插画", "动态捕捉", "热血竞技"],
        localPath: "images/book_cover.jpg",
        gradient: "linear-gradient(135deg, #ca8a04 0%, #ea580c 55%, #991b1b 100%)",

      {

        desc: "两套完整移动端 UI/UX 视觉设计，分别针对医疗健康硬件控制与Z世代情感陪伴手账场景。",
        bullets: [
          "智能助听器 App：包含3D耳机主界面、降噪调节、中医耳穴按摩（听宫穴定位）、听力健康与个人中心",
          "《灵植悦联 / hana》App：清新森系视觉，涵盖日记手账贴纸排版、22°C温湿度生长环境监测、AI小灵陪伴对话与日历打卡"

        watermark: "UI DESIGN"
      },
      {
        id: "posters",
        category: "ui",
        categoryName: "UI 作品及其他 · 展板与海报",
        title: "2. 《光屿 Lumen Blocks》展板与流光配饰海报",
        desc: "结合工业产品结构展示、市场数据可视化与东方美学配饰宣传的综合平面设计。",
        bullets: [
          "《光屿》产品展板：包含用户定位、数据图表分析、低碳环保理念及模块化组件自由拼搭结构爆炸图",
          "“白山黑水”云流光系列配饰：融合自然山水意境的品牌视觉海报设计"
        ],
        tags: ["产品展板", "信息可视化", "品牌海报", "平面设计"],
        localPath: "images/posters.jpg",
        gradient: "linear-gradient(135deg, #065f46 0%, #047857 50%, #111827 100%)",
        watermark: "POSTER"
      }
    ];

    // 存储用户通过浏览器临时上传的图片 Base64
    const customImages = {};
    let currentEditingId = null;

    const gridEl = document.getElementById("portfolioGrid");
    const fileInput = document.getElementById("imageInput");

    function renderGallery(filter = "all") {
      gridEl.innerHTML = "";
      const list = filter === "all"
        ? portfolioItems
        : portfolioItems.filter(item => item.category === filter);

      list.forEach(item => {
        const hasCustomImg = customImages[item.id];
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div class="card-cover" onclick="openModal('${item.id}')">
            <button class="replace-img-btn" onclick="triggerReplace(event, '${item.id}')">🖼️ 替换本地图片</button>
            ${
              hasCustomImg
                ? `<img src="${hasCustomImg}" alt="${item.title}">`
                : `<div class="art-placeholder" style="background: ${item.gradient}">
                     <span class="art-preview-label">点击查看项目详情 · 右上角可换图</span>
                     <div class="art-watermark">${item.watermark}</div>
                   </div>`
            }
          </div>
          <div class="card-body">
            <div>
              <div class="card-meta">
                <span class="category-badge">${item.categoryName}</span>
                <span class="file-hint">${item.localPath}</span>
              </div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${item.desc}</p>
            </div>
            <div class="tags">
              ${item.tags.map(t => `<span class="tag"># ${t}</span>`).join("")}
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    // 分类标签切换
    document.getElementById("filterNav").addEventListener("click", e => {
      if (!e.target.classList.contains("filter-tab")) return;
      document.querySelectorAll(".filter-tab").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      renderGallery(e.target.dataset.filter);
    });

    // 本地选图实时替换预览
    function triggerReplace(e, id) {
      e.stopPropagation();
      currentEditingId = id;
      fileInput.click();
    }

    fileInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file || !currentEditingId) return;
      const reader = new FileReader();
      reader.onload = ev => {
        customImages[currentEditingId] = ev.target.result;
        const activeFilter = document.querySelector(".filter-tab.active").dataset.filter;
        renderGallery(activeFilter);
      };
      reader.readAsDataURL(file);
    });

    // 弹窗逻辑
    function openModal(id) {
      const item = portfolioItems.find(x => x.id === id);
      if (!item) return;
      document.getElementById("modalCategory").textContent = item.categoryName;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalDesc").textContent = item.desc;
      document.getElementById("modalBullets").innerHTML = item.bullets.map(b => `<li>${b}</li>`).join("");

      const imgBox = document.getElementById("modalImageContainer");
      if (customImages[item.id]) {
        imgBox.innerHTML = `<img src="${customImages[item.id]}" alt="${item.title}">`;
      } else {
        imgBox.innerHTML = `
          <div class="art-placeholder" style="background: ${item.gradient}; min-height: 320px;">
            <span class="art-preview-label">尚未载入本地原图（默认文件名为 ${item.localPath}）</span>
            <div class="art-watermark" style="font-size:64px;">${item.watermark}</div>
          </div>`;
      }
      document.getElementById("projectModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("projectModal").classList.remove("open");
    }

    // 初始渲染
    renderGallery();
  </script>
</body>
